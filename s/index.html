<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>try{const t=localStorage.getItem('steep-theme-v1');document.documentElement.dataset.theme=['light','dark','system'].includes(t)?t:'system'}catch{document.documentElement.dataset.theme='system'}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Shared chat · Steep</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/responses.css"><link rel="stylesheet" href="/css/attach.css"><link rel="stylesheet" href="/css/app-ui.css"><link rel="stylesheet" href="/css/dark.css">
<style>body{height:auto;overflow:auto;background:var(--cream);color:var(--ink)}.shared-page{max-width:800px;margin:auto;padding:24px 18px 64px}.shared-page header{margin-bottom:24px}.shared-page h1{font-size:24px}.shared-page .attach-preview{max-width:100%;max-height:70vh;object-fit:contain}.shared-page .message{margin:18px 0}.shared-page .bubble{min-width:0;overflow-wrap:anywhere}.shared-page a{color:var(--ink)}</style>
<script type="module" src="/js/share-view.js"></script>
</head>
<body><main class="shared-page"><header><a href="/app/">steep.</a><h1 id="share-title">Shared chat</h1><p id="share-status" role="status">Loading shared chat…</p></header><div id="shared-messages" aria-label="Read-only conversation"></div><noscript>Enable JavaScript to view this shared conversation.</noscript></main></body>
</html>
