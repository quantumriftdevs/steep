<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Steep</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/app-anim.css"><link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/composer.css">
  <link rel="stylesheet" href="/css/voice.css">
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/voice.js"></script>
  <script type="module" src="/js/composer.js"></script>
</head>
<body>
  <div class="shell">
    <button class="scrim" id="scrim" aria-label="Close conversation menu" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="side-top"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h14l-1.5 15a4 4 0 0 1-4 3h-3a4 4 0 0 1-4-3L5 3Zm3 8 1 6a1 1 0 1 0 2 0 1 1 0 1 0-2 0Zm5 2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg></span><span class="brand-word">steep<span>.</span></span></a></div>
      <a class="side-nav" href="#conversations"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l2-3a8 8 0 1 1 13-5Z"/></svg><span>Chats</span></a>
      <p class="side-label">Recents</p>
      <nav id="conversations" aria-label="Chat history"></nav>
      <div class="side-bottom"><span id="profile-avatar" class="profile-avatar" aria-label="Your profile">S</span><button id="new-chat" class="new-chat"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> <span>New chat</span></button></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><button id="open-menu" class="icon mobile" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="top-brand" href="/">steep<span>.</span></a><span id="connection"></span></header>
      <div id="thread" class="thread" aria-live="polite">
        <div class="thread-inner" id="messages"></div>
      </div>
      <div class="composer-wrap">
        <p id="error" class="error" role="alert" hidden></p>
        <form id="composer" class="composer"><label class="sr-only" for="prompt">Message Steep</label><textarea id="prompt" rows="1" maxlength="12000" placeholder="Ask Steep anything…" required></textarea><button id="send" type="submit" aria-label="Send message"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4M6 10l6-6 6 6"/></svg></button></form>
      </div>
    </main>
  </div>
<template id="empty-template"><section class="empty"><span class="empty-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h14l-1.5 15a4 4 0 0 1-4 3h-3a4 4 0 0 1-4-3L5 3Zm3 8 1 6a1 1 0 1 0 2 0 1 1 0 1 0-2 0Zm5 2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg></span><h1></h1><form class="name-form"><label for="visitor-name">What should Steep call you?</label><div><input id="visitor-name" maxlength="60" autocomplete="nickname" placeholder="Your name"><button type="submit">Save</button><button class="name-skip" type="button">Skip</button></div></form><div class="examples"></div></section></template></body>
</html>
